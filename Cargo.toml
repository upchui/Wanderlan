[workspace]
resolver = "3"
members = ["crates/wanderlan-core", "crates/wanderland", "crates/wanderlan"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/upchui/Wanderlan"
authors = ["wanderlan contributors"]

[workspace.dependencies]
wanderlan-core = { path = "crates/wanderlan-core" }
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3.34"
humantime = "2.4.0"
insta = "1"
ipnet = { version = "2.12.2", features = ["serde"] }
libc = "0.2.191"
nftables = { version = "0.6.3", features = ["tokio"] }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_spanned = "1.1.3"
sha2 = "0.11.1"
hkdf = "0.13.0"
hmac = "0.13.0"
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
similar = "3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "fs"] }
toml = { version = "1.2.2", features = ["preserve_order"] }
rtnetlink = "0.24.0"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
