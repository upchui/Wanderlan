# wanderlan example site-local configuration.
# Copy to /etc/wanderlan/local.toml and adjust. This file is never synchronised.

self = "haus2"     # this site in network.toml: its name (by hand) or its identity
trunk = "ens19"    # local interface carrying the VLANs (tagged trunk)

# Optional: a tunnel with a trunk of its own. It becomes a segment of its own
# at this site (bridge wl-ens20): only the network on ens20 reaches "heim"
# through this site; all other tunnels use the trunk above.
# [tunnels.heim]
# trunk = "ens20"
