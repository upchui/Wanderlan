# wanderlan example network configuration.
#
# Usually nobody writes this file by hand: set up the first site with
# `wanderlan` ("Start a new network"), then add every further site with an
# invitation: `wanderlan invite` on any site that is already part of the
# network, `wanderlan join <address> <code>` on the new one. The daemons keep
# this file identical on all sites.
#
# wanderlan does not build a VPN. Every site must already be reachable at its
# `address` through an existing transport network, usually a VPN set up
# beforehand (WireGuard, IPsec, a provider network, ...). Sites without
# `server` are servers: they are connected with each other and must reach
# each other there. A site with `server` is a client of that site: its only
# tunnel leads there (sites that join with an invitation become
# clients of the inviting site).

[network]
vlans = "10-50"               # VLANs of every site that does not list its own
mtu_probe_interval = "5m"     # how often the path MTU to each peer is measured
# mss = 1300                  # optional: fixed TCP MSS instead of measuring
commit_timeout = "60s"        # changes are rolled back unless confirmed in time

[site.heim]
address = "10.8.0.1"

[site.buero]
address = "10.8.0.2"

[site.haus2]
address = "10.8.0.11"
vlans = "20,30"               # haus2 only takes part in VLANs 20 and 30

[site.haus3]
address = "10.8.0.12"
# server = "heim"             # would make haus3 a client of heim
# Source VLAN = VLAN on the trunk of haus3: VLAN 20 of the network is
# untagged there, VLAN 30 is VLAN 130 there.
map = { 20 = "native", 30 = 130 }
# tunnel_vlans = { heim = "20-30" }  # the tunnel to heim carries at most 20-30
