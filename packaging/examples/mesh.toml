# wanderlan example mesh configuration.
#
# Copy this file to /etc/wanderlan/mesh.toml on one site, adjust it and run
# `wanderlan apply`. The daemon distributes it to all other sites.
#
# wanderlan does not build a VPN. Every site must already be reachable at its
# `address` through an existing transport network, usually a VPN set up
# beforehand (WireGuard, IPsec, a provider network, ...). wanderlan builds the
# layer-2 part (GRETAP tunnels, bridge, VLANs) on top of it.

[mesh]
vlans = "10-50"               # VLANs stretched across all sites
mtu_probe_interval = "5m"     # how often the path MTU to each peer is measured
# mss = 1300                  # optional: fixed TCP MSS instead of measuring
commit_timeout = "60s"        # changes are rolled back unless confirmed in time

[[site]]
name = "heim"
role = "hub"
address = "10.8.0.1"

[[site]]
name = "buero"
role = "hub"
address = "10.8.0.2"

[[site]]
name = "haus2"
role = "spoke"
hub = "heim"
address = "10.8.0.11"

[[site]]
name = "haus3"
role = "spoke"
hub = "buero"
address = "10.8.0.12"

# Untagged traffic on the trunk of haus3 belongs to shared VLAN 20.
[[map]]
site = "haus3"
local = "native"
shared = 20

# Local VLAN 130 at haus3 is shared VLAN 30 everywhere else.
[[map]]
site = "haus3"
local = 130
shared = 30
