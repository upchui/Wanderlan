# Static musl builds use the self-contained musl CRT shipped with the Rust
# toolchain and link with rust-lld, so no C cross toolchain is required.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
