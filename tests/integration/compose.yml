# Integration test topology (see tests/integration/README.md).
#
# Every site has its own underlay network; a router connects them. The
# underlay stands in for the transport network (usually a VPN) that wanderlan
# expects to exist. Every site also has a trunk network with one client.
name: wanderlan-it

x-common: &common
  image: ${TESTNODE_IMAGE:-wanderlan-testnode}
  init: true
  cap_add: [NET_ADMIN]
  stop_grace_period: 5s
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "1"
    net.ipv6.conf.default.disable_ipv6: "1"

services:
  router:
    <<: *common
    hostname: router
    environment:
      ROLE: router
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    networks:
      ul-site1: { ipv4_address: 10.100.1.254 }
      ul-site2: { ipv4_address: 10.100.2.254 }
      ul-site3: { ipv4_address: 10.100.11.254 }
      ul-site4: { ipv4_address: 10.100.12.254 }
      ul-site5: { ipv4_address: 10.100.13.254 }

  site1:
    <<: *common
    hostname: site1
    environment:
      ROLE: site
      TRUNK_NET: "10.200.1."
      GATEWAY: 10.100.1.254
    networks:
      ul-site1: { ipv4_address: 10.100.1.10 }
      tr-site1: { ipv4_address: 10.200.1.10 }

  c-site1:
    <<: *common
    hostname: c-site1
    environment:
      ROLE: client
      TRUNK_NET: "10.200.1."
    networks:
      tr-site1: { ipv4_address: 10.200.1.20 }

  site2:
    <<: *common
    hostname: site2
    environment:
      ROLE: site
      TRUNK_NET: "10.200.2."
      GATEWAY: 10.100.2.254
    networks:
      ul-site2: { ipv4_address: 10.100.2.10 }
      tr-site2: { ipv4_address: 10.200.2.10 }

  c-site2:
    <<: *common
    hostname: c-site2
    environment:
      ROLE: client
      TRUNK_NET: "10.200.2."
    networks:
      tr-site2: { ipv4_address: 10.200.2.20 }

  site3:
    <<: *common
    hostname: site3
    environment:
      ROLE: site
      TRUNK_NET: "10.200.11."
      GATEWAY: 10.100.11.254
    networks:
      ul-site3: { ipv4_address: 10.100.11.10 }
      tr-site3: { ipv4_address: 10.200.11.10 }

  c-site3:
    <<: *common
    hostname: c-site3
    environment:
      ROLE: client
      TRUNK_NET: "10.200.11."
    networks:
      tr-site3: { ipv4_address: 10.200.11.20 }

  site4:
    <<: *common
    hostname: site4
    environment:
      ROLE: site
      TRUNK_NET: "10.200.12."
      GATEWAY: 10.100.12.254
    networks:
      ul-site4: { ipv4_address: 10.100.12.10 }
      tr-site4: { ipv4_address: 10.200.12.10 }

  c-site4:
    <<: *common
    hostname: c-site4
    environment:
      ROLE: client
      TRUNK_NET: "10.200.12."
    networks:
      tr-site4: { ipv4_address: 10.200.12.20 }

  site5:
    <<: *common
    hostname: site5
    environment:
      ROLE: site
      TRUNK_NET: "10.200.13."
      GATEWAY: 10.100.13.254
    networks:
      ul-site5: { ipv4_address: 10.100.13.10 }
      tr-site5: { ipv4_address: 10.200.13.10 }

  c-site5:
    <<: *common
    hostname: c-site5
    environment:
      ROLE: client
      TRUNK_NET: "10.200.13."
    networks:
      tr-site5: { ipv4_address: 10.200.13.20 }

  # Bridges the trunk networks of site3 and site4 on request, creating a
  # layer-2 loop outside wanderlan (for the loop guard test).
  looper:
    <<: *common
    hostname: looper
    environment:
      ROLE: looper
      TRUNK_NET: "10.200.11."
      TRUNK_NET2: "10.200.12."
    networks:
      tr-site3: { ipv4_address: 10.200.11.30 }
      tr-site4: { ipv4_address: 10.200.12.30 }

networks:
  ul-site1:
    internal: true
    ipam:
      config: [{ subnet: 10.100.1.0/24 }]
  ul-site2:
    internal: true
    ipam:
      config: [{ subnet: 10.100.2.0/24 }]
  ul-site3:
    internal: true
    ipam:
      config: [{ subnet: 10.100.11.0/24 }]
  ul-site4:
    internal: true
    ipam:
      config: [{ subnet: 10.100.12.0/24 }]
  ul-site5:
    internal: true
    driver_opts:
      com.docker.network.driver.mtu: "1400"
    ipam:
      config: [{ subnet: 10.100.13.0/24 }]
  tr-site1:
    internal: true
    ipam:
      config: [{ subnet: 10.200.1.0/24 }]
  tr-site2:
    internal: true
    ipam:
      config: [{ subnet: 10.200.2.0/24 }]
  tr-site3:
    internal: true
    ipam:
      config: [{ subnet: 10.200.11.0/24 }]
  tr-site4:
    internal: true
    ipam:
      config: [{ subnet: 10.200.12.0/24 }]
  tr-site5:
    internal: true
    ipam:
      config: [{ subnet: 10.200.13.0/24 }]
