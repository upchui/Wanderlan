# Integration test topology (see tests/integration/README.md).
#
# Every site has its own underlay network; a router connects them. The
# underlay stands in for the transport network (usually a VPN) that wanderlan
# expects to exist. Every site also has a trunk network with one client.
name: wanderlan-it

x-common: &common
  image: ${TESTNODE_IMAGE:-wanderlan-testnode}
  init: true
  cap_add: [NET_ADMIN]
  stop_grace_period: 5s
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "1"
    net.ipv6.conf.default.disable_ipv6: "1"

services:
  router:
    <<: *common
    hostname: router
    environment:
      ROLE: router
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    networks:
      ul-hub1: { ipv4_address: 10.100.1.254 }
      ul-hub2: { ipv4_address: 10.100.2.254 }
      ul-spoke1: { ipv4_address: 10.100.11.254 }
      ul-spoke2: { ipv4_address: 10.100.12.254 }
      ul-spoke3: { ipv4_address: 10.100.13.254 }

  hub1:
    <<: *common
    hostname: hub1
    environment:
      ROLE: site
      TRUNK_NET: "10.200.1."
      GATEWAY: 10.100.1.254
    networks:
      ul-hub1: { ipv4_address: 10.100.1.10 }
      tr-hub1: { ipv4_address: 10.200.1.10 }

  c-hub1:
    <<: *common
    hostname: c-hub1
    environment:
      ROLE: client
      TRUNK_NET: "10.200.1."
    networks:
      tr-hub1: { ipv4_address: 10.200.1.20 }

  hub2:
    <<: *common
    hostname: hub2
    environment:
      ROLE: site
      TRUNK_NET: "10.200.2."
      GATEWAY: 10.100.2.254
    networks:
      ul-hub2: { ipv4_address: 10.100.2.10 }
      tr-hub2: { ipv4_address: 10.200.2.10 }

  c-hub2:
    <<: *common
    hostname: c-hub2
    environment:
      ROLE: client
      TRUNK_NET: "10.200.2."
    networks:
      tr-hub2: { ipv4_address: 10.200.2.20 }

  spoke1:
    <<: *common
    hostname: spoke1
    environment:
      ROLE: site
      TRUNK_NET: "10.200.11."
      GATEWAY: 10.100.11.254
    networks:
      ul-spoke1: { ipv4_address: 10.100.11.10 }
      tr-spoke1: { ipv4_address: 10.200.11.10 }

  c-spoke1:
    <<: *common
    hostname: c-spoke1
    environment:
      ROLE: client
      TRUNK_NET: "10.200.11."
    networks:
      tr-spoke1: { ipv4_address: 10.200.11.20 }

  spoke2:
    <<: *common
    hostname: spoke2
    environment:
      ROLE: site
      TRUNK_NET: "10.200.12."
      GATEWAY: 10.100.12.254
    networks:
      ul-spoke2: { ipv4_address: 10.100.12.10 }
      tr-spoke2: { ipv4_address: 10.200.12.10 }

  c-spoke2:
    <<: *common
    hostname: c-spoke2
    environment:
      ROLE: client
      TRUNK_NET: "10.200.12."
    networks:
      tr-spoke2: { ipv4_address: 10.200.12.20 }

  spoke3:
    <<: *common
    hostname: spoke3
    environment:
      ROLE: site
      TRUNK_NET: "10.200.13."
      GATEWAY: 10.100.13.254
    networks:
      ul-spoke3: { ipv4_address: 10.100.13.10 }
      tr-spoke3: { ipv4_address: 10.200.13.10 }

  c-spoke3:
    <<: *common
    hostname: c-spoke3
    environment:
      ROLE: client
      TRUNK_NET: "10.200.13."
    networks:
      tr-spoke3: { ipv4_address: 10.200.13.20 }

  # Bridges the trunk networks of spoke1 and spoke2 on request, creating a
  # layer-2 loop outside wanderlan (for the loop guard test).
  looper:
    <<: *common
    hostname: looper
    environment:
      ROLE: looper
      TRUNK_NET: "10.200.11."
      TRUNK_NET2: "10.200.12."
    networks:
      tr-spoke1: { ipv4_address: 10.200.11.30 }
      tr-spoke2: { ipv4_address: 10.200.12.30 }

networks:
  ul-hub1:
    internal: true
    ipam:
      config: [{ subnet: 10.100.1.0/24 }]
  ul-hub2:
    internal: true
    ipam:
      config: [{ subnet: 10.100.2.0/24 }]
  ul-spoke1:
    internal: true
    ipam:
      config: [{ subnet: 10.100.11.0/24 }]
  ul-spoke2:
    internal: true
    ipam:
      config: [{ subnet: 10.100.12.0/24 }]
  ul-spoke3:
    internal: true
    driver_opts:
      com.docker.network.driver.mtu: "1400"
    ipam:
      config: [{ subnet: 10.100.13.0/24 }]
  tr-hub1:
    internal: true
    ipam:
      config: [{ subnet: 10.200.1.0/24 }]
  tr-hub2:
    internal: true
    ipam:
      config: [{ subnet: 10.200.2.0/24 }]
  tr-spoke1:
    internal: true
    ipam:
      config: [{ subnet: 10.200.11.0/24 }]
  tr-spoke2:
    internal: true
    ipam:
      config: [{ subnet: 10.200.12.0/24 }]
  tr-spoke3:
    internal: true
    ipam:
      config: [{ subnet: 10.200.13.0/24 }]
