# Integration test topology (see tests/integration/README.md).
#
# Every site has its own underlay network; a router connects them. The
# underlay stands in for the transport network (usually a VPN) that wanderlan
# expects to exist. Every site also has a trunk network with one client;
# site1 has a second trunk (trunk1) with a client for "trunk per tunnel".
# natc1 and natc2 sit behind one NAT (the container nat, masquerading with
# random ports): they reach the others, nobody reaches them.
name: wanderlan-it

x-common: &common
  image: ${TESTNODE_IMAGE:-wanderlan-testnode}
  init: true
  cap_add: [NET_ADMIN]
  stop_grace_period: 5s
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "1"
    net.ipv6.conf.default.disable_ipv6: "1"

services:
  router:
    <<: *common
    hostname: router
    environment:
      ROLE: router
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    networks:
      ul-site1: { ipv4_address: 10.100.1.254 }
      ul-site2: { ipv4_address: 10.100.2.254 }
      ul-site3: { ipv4_address: 10.100.11.254 }
      ul-site4: { ipv4_address: 10.100.12.254 }
      ul-site5: { ipv4_address: 10.100.13.254 }
      ul-nat: { ipv4_address: 10.100.20.254 }

  nat:
    <<: *common
    hostname: nat
    environment:
      ROLE: nat
      WAN_NET: "10.100.20."
      GATEWAY: 10.100.20.254
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    networks:
      ul-nat: { ipv4_address: 10.100.20.10 }
      lan-nat: { ipv4_address: 192.168.77.254 }

  natc1:
    <<: *common
    hostname: natc1
    environment:
      ROLE: site
      TRUNK_NET: "10.200.31."
      GATEWAY: 192.168.77.254
    networks:
      lan-nat: { ipv4_address: 192.168.77.11 }
      tr-natc1: { ipv4_address: 10.200.31.10 }

  c-natc1:
    <<: *common
    hostname: c-natc1
    environment:
      ROLE: client
      TRUNK_NET: "10.200.31."
    networks:
      tr-natc1: { ipv4_address: 10.200.31.20 }

  natc2:
    <<: *common
    hostname: natc2
    environment:
      ROLE: site
      TRUNK_NET: "10.200.32."
      GATEWAY: 192.168.77.254
    networks:
      lan-nat: { ipv4_address: 192.168.77.12 }
      tr-natc2: { ipv4_address: 10.200.32.10 }

  c-natc2:
    <<: *common
    hostname: c-natc2
    environment:
      ROLE: client
      TRUNK_NET: "10.200.32."
    networks:
      tr-natc2: { ipv4_address: 10.200.32.20 }

  site1:
    <<: *common
    hostname: site1
    environment:
      ROLE: site
      TRUNK_NET: "10.200.1."
      TRUNK_NET_B: "10.200.21."
      GATEWAY: 10.100.1.254
    networks:
      ul-site1: { ipv4_address: 10.100.1.10 }
      tr-site1: { ipv4_address: 10.200.1.10 }
      tr-site1b: { ipv4_address: 10.200.21.10 }

  c-site1:
    <<: *common
    hostname: c-site1
    environment:
      ROLE: client
      TRUNK_NET: "10.200.1."
    networks:
      tr-site1: { ipv4_address: 10.200.1.20 }

  c-site1b:
    <<: *common
    hostname: c-site1b
    environment:
      ROLE: client
      TRUNK_NET: "10.200.21."
    networks:
      tr-site1b: { ipv4_address: 10.200.21.20 }

  site2:
    <<: *common
    hostname: site2
    environment:
      ROLE: site
      TRUNK_NET: "10.200.2."
      GATEWAY: 10.100.2.254
    networks:
      ul-site2: { ipv4_address: 10.100.2.10 }
      tr-site2: { ipv4_address: 10.200.2.10 }

  c-site2:
    <<: *common
    hostname: c-site2
    environment:
      ROLE: client
      TRUNK_NET: "10.200.2."
    networks:
      tr-site2: { ipv4_address: 10.200.2.20 }

  site3:
    <<: *common
    hostname: site3
    environment:
      ROLE: site
      TRUNK_NET: "10.200.11."
      GATEWAY: 10.100.11.254
    networks:
      ul-site3: { ipv4_address: 10.100.11.10 }
      tr-site3: { ipv4_address: 10.200.11.10 }

  c-site3:
    <<: *common
    hostname: c-site3
    environment:
      ROLE: client
      TRUNK_NET: "10.200.11."
    networks:
      tr-site3: { ipv4_address: 10.200.11.20 }

  site4:
    <<: *common
    hostname: site4
    environment:
      ROLE: site
      TRUNK_NET: "10.200.12."
      GATEWAY: 10.100.12.254
    networks:
      ul-site4: { ipv4_address: 10.100.12.10 }
      tr-site4: { ipv4_address: 10.200.12.10 }

  c-site4:
    <<: *common
    hostname: c-site4
    environment:
      ROLE: client
      TRUNK_NET: "10.200.12."
    networks:
      tr-site4: { ipv4_address: 10.200.12.20 }

  site5:
    <<: *common
    hostname: site5
    environment:
      ROLE: site
      TRUNK_NET: "10.200.13."
      GATEWAY: 10.100.13.254
    networks:
      ul-site5: { ipv4_address: 10.100.13.10 }
      tr-site5: { ipv4_address: 10.200.13.10 }

  c-site5:
    <<: *common
    hostname: c-site5
    environment:
      ROLE: client
      TRUNK_NET: "10.200.13."
    networks:
      tr-site5: { ipv4_address: 10.200.13.20 }

  # Bridges the trunk networks of site3 and site4 on request, creating a
  # layer-2 loop outside wanderlan (for the loop guard test).
  looper:
    <<: *common
    hostname: looper
    environment:
      ROLE: looper
      TRUNK_NET: "10.200.11."
      TRUNK_NET2: "10.200.12."
    networks:
      tr-site3: { ipv4_address: 10.200.11.30 }
      tr-site4: { ipv4_address: 10.200.12.30 }

networks:
  ul-site1:
    internal: true
    ipam:
      config: [{ subnet: 10.100.1.0/24 }]
  ul-site2:
    internal: true
    ipam:
      config: [{ subnet: 10.100.2.0/24 }]
  ul-site3:
    internal: true
    ipam:
      config: [{ subnet: 10.100.11.0/24 }]
  ul-site4:
    internal: true
    ipam:
      config: [{ subnet: 10.100.12.0/24 }]
  ul-site5:
    internal: true
    driver_opts:
      com.docker.network.driver.mtu: "1400"
    ipam:
      config: [{ subnet: 10.100.13.0/24 }]
  ul-nat:
    internal: true
    ipam:
      config: [{ subnet: 10.100.20.0/24 }]
  lan-nat:
    internal: true
    ipam:
      config: [{ subnet: 192.168.77.0/24 }]
  tr-natc1:
    internal: true
    ipam:
      config: [{ subnet: 10.200.31.0/24 }]
  tr-natc2:
    internal: true
    ipam:
      config: [{ subnet: 10.200.32.0/24 }]
  tr-site1:
    internal: true
    ipam:
      config: [{ subnet: 10.200.1.0/24 }]
  tr-site1b:
    internal: true
    ipam:
      config: [{ subnet: 10.200.21.0/24 }]
  tr-site2:
    internal: true
    ipam:
      config: [{ subnet: 10.200.2.0/24 }]
  tr-site3:
    internal: true
    ipam:
      config: [{ subnet: 10.200.11.0/24 }]
  tr-site4:
    internal: true
    ipam:
      config: [{ subnet: 10.200.12.0/24 }]
  tr-site5:
    internal: true
    ipam:
      config: [{ subnet: 10.200.13.0/24 }]
