name: Release

# Optional: a tag v<version> (matching Cargo.toml) creates a GitHub release
# with binaries, packages and SHA256SUMS, and puts <version>-1 into the APT
# repository, where tagged versions are kept forever. Builds and tests run
# through the same build.yml as CI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      deb_version: ${{ steps.v.outputs.deb_version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Tag must match the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deb_version=$version-1" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: GitHub release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum wanderlan* > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" wanderlan* SHA256SUMS --clobber
          else
            notes=$(awk '/^## /{n++} n==1' ../CHANGELOG.md | tail -n +2)
            gh release create "$GITHUB_REF_NAME" wanderlan* SHA256SUMS \
              --title "wanderlan $VERSION" \
              --notes "${notes:-See CHANGELOG.md}"
          fi

  apt:
    name: APT repository
    needs: [version, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: ./.github/actions/apt-publish
        with:
          dist: dist
          message: "APT repository: wanderlan ${{ needs.version.outputs.deb_version }} (release)"
          signing-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.APT_GPG_PASSPHRASE }}

  verify:
    name: verify
    needs: [version, apt]
    uses: ./.github/workflows/verify-apt.yml
    with:
      deb_version: ${{ needs.version.outputs.deb_version }}
