name: CI

# Every push to a branch and every pull request: fmt, clippy, tests, the
# packages for amd64 and arm64 with a smoke test, the integration tests and
# wanderland under systemd with the hardened unit.
# A green run on main is published to the APT repository by publish.yml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # scripts/version.sh counts commits
      - id: v
        name: Version of this build
        # The Cargo.toml version with its last number raised by the commits
        # since it was set: every commit on main has a higher one.
        run: |
          version=$(scripts/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### wanderlan $version" >> "$GITHUB_STEP_SUMMARY"

  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build check stage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: check
          push: false
          provenance: false
          cache-from: type=gha,scope=check
          cache-to: type=gha,mode=max,scope=check
      - name: APT repository script (retention, indices, signatures)
        run: scripts/test-apt-repo.sh
      - name: Version numbering
        run: scripts/test-version.sh

  build:
    name: build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  integration:
    name: integration tests
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Load kernel modules
        run: scripts/load-modules.sh
      - uses: docker/setup-buildx-action@v4
      - name: Build testnode image (installs the .deb)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: testnode
          build-args: WANDERLAN_VERSION=${{ needs.version.outputs.version }}
          load: true
          tags: wanderlan-testnode
          provenance: false
          cache-from: type=gha,scope=build-amd64
      - name: Run integration tests
        run: tests/integration/run.sh

  systemd:
    name: systemd (hardened unit, user flows)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Load kernel modules
        run: scripts/load-modules.sh
      - uses: docker/setup-buildx-action@v4
      - name: Build systemdnode image (systemd as PID 1, installs the .deb)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: systemdnode
          build-args: WANDERLAN_VERSION=${{ needs.version.outputs.version }}
          load: true
          tags: wanderlan-systemdnode
          provenance: false
          cache-from: type=gha,scope=build-amd64
      - name: Run wanderland under systemd
        run: tests/systemd/run.sh
