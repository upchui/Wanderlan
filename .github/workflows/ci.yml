name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build check stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: check
          push: false
          cache-from: type=gha,scope=check
          cache-to: type=gha,mode=max,scope=check
